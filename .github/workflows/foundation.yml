name: Foundation CI
on:
  push:
    branches: [main, planning/sprint-01-foundation]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build API
        run: dotnet build backend/src/Kanoonyar.Api/Kanoonyar.Api.csproj --configuration Release
      - name: Test foundation
        run: dotnet test backend/tests/Kanoonyar.Api.Tests/Kanoonyar.Api.Tests.csproj --configuration Release
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
  ai-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AI skeleton
        working-directory: ai
        run: python -m pip install -e .
      - name: Run AI contract tests
        working-directory: ai
        run: python -m unittest discover -s tests -v
  frontend-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/planning/sprint-01-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile without modifying repository
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Publish generated lockfile for reviewed commit
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated lockfile to the same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(frontend): pin npm dependency graph"
            git push origin HEAD:planning/sprint-01-foundation
          fi
