name: One-time Vite lockfile repair
on:
  push:
    branches: [planning/sprint-01-foundation]
    paths: ['.github/workflows/repair-vite-lock.yml']
permissions:
  contents: read
jobs:
  repair:
    if: github.event_name == 'push' && github.ref == 'refs/heads/planning/sprint-01-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate lockfile from registry
        working-directory: frontend
        run: npm install --save-dev --save-exact vite@7.3.7 --no-audit --no-fund
      - name: Verify reproducible install and advisory status
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
      - name: Commit both manifests to same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix(frontend): upgrade vulnerable Vite and regenerate npm lockfile'
          git push origin HEAD:planning/sprint-01-foundation
